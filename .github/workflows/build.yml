name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # Release step (softprops/action-gh-release) needs it on tag builds
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 建置 ptts_ffi.dll 並下載鎖定修訂的模型檔（gitignored assets/tts/），
      # dotnet publish 的 EmbeddedResource 條件成立後自動嵌入。
      - name: Fetch TTS assets
        run: pwsh scripts/fetch-assets.ps1

      - name: Publish
        run: dotnet publish AITranslator.csproj -c Release -r win-x64 -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AITranslator-win-x64
          # .NET 8 single-file output embeds the native libraries; the exe alone runs.
          path: publish/AITranslator.exe

      - name: Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/AITranslator.exe